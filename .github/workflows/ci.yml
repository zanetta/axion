name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-and-test:
    name: Pack lint + CLI tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python lint dependencies
        run: pip install pyyaml jsonschema

      - name: Lint path drift (Q-01)
        run: python3 .cursor/scripts/lint_paths.py .

      - name: Lint skill/command contracts (Q-02)
        run: python3 .cursor/scripts/lint_contracts.py .

      - name: Lint doc/inventory parity (Q-03)
        run: python3 .cursor/scripts/lint_inventory.py .

      - name: Eval routing golden cases (E-01)
        run: python3 .cursor/scripts/eval_routing.py .

      - name: Eval FSM gates (E-02)
        run: python3 .cursor/scripts/eval_routing.py . --gates

      - name: Install dependencies
        run: npm ci

      - name: Run CLI tests + post-install smoke (E-03)
        run: npm test
