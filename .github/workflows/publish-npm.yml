name: Publish CLI to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pre-publish:
    name: Pre-publish gate (Q-04)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: Publish @zanetta/axion
    needs: pre-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match cli/package.json version $PKG_VERSION" >&2
            exit 1
          fi
          echo "Publishing version: $PKG_VERSION"

      - name: Require NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::GitHub Actions secret NPM_TOKEN is not set. Actions cannot read .env; add the token in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --workspace=@zanetta/axion --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
